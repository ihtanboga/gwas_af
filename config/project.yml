project:
  name: AFSHF-TARGETMAP
  short_name: afshf
  description: >
    AF-Stroke-HF therapeutic pleiotropy atlas using public GWAS, pQTL, eQTL,
    colocalization, and druggability annotations. For each genetically supported
    target the pipeline derives a therapeutic intervention direction from AF
    benefit and projects predicted effects onto HF and stroke subtypes.
  genome_build_preferred: GRCh38
  primary_ancestry: EUR
  allow_mixed_ancestry_secondary: true

thresholds:
  qtl_p_primary: 5.0e-8
  qtl_p_exploratory: 5.0e-6
  min_f_stat: 10
  clump_r2: 0.001
  clump_kb: 10000
  cis_window_kb: 1000
  coloc_strong_pph4: 0.80
  coloc_moderate_pph4: 0.50
  coloc_lcl_h3_warn: 0.50
  mr_fdr_primary: 0.05
  mr_p_replication: 0.05
  maf_min_primary: 0.01

intervention:
  define_action_from_af: true
  action_rule: "d_T = -sign(beta_target_to_AF)"
  report_or_scale: log_or_and_or
  af_signal_min_p: 0.05
  af_signal_min_pph4: 0.50

outcomes:
  primary:
    - AF
    - HF_overall
    - HF_nonischemic
    - HF_ni_HFrEF
    - ischemic_stroke
    - cardioembolic_stroke
    - large_artery_stroke
    - small_vessel_stroke
  exploratory:
    - HF_ni_HFpEF              # D001 REVISED — HFpEF cannot trigger primary classes
  safety:
    - hemorrhagic_stroke
    - intracranial_hemorrhage
    - VTE
    - CAD
    - MI
    - cardiomyopathy
    - bradyarrhythmia
    - PR_interval
    - QT_interval
    - QRS_duration
    - systolic_BP
    - diastolic_BP
    - CKD
    - liver_disease
    - bleeding

scoring:
  # D008 REVISED — severity weights enter ONLY therapeutic_balance_score and
  # ranking. They MUST NOT influence classify_target() (target_class is
  # severity-objective).
  harm_penalty_lambda: 1.5
  max_logp_component: 10
  severity_weights:
    AF: 1.0
    HF_overall: 1.3
    HF_nonischemic: 1.3
    HF_ni_HFrEF: 1.5
    HF_ni_HFpEF: 1.1            # exploratory — small ranking weight
    ischemic_stroke: 1.5
    cardioembolic_stroke: 1.4
    large_artery_stroke: 1.3
    small_vessel_stroke: 1.3
    hemorrhagic_stroke: 1.7
  coloc_weight_pph4_strong: 1.0
  coloc_weight_pph4_moderate: 0.6
  coloc_weight_pph4_weak: 0.2
  replication_weight_replicated: 1.0
  replication_weight_partial: 0.6
  replication_weight_none: 0.3

paths:
  data_raw: data/raw
  data_processed: data/processed
  results: results
  figures: figures
  reports: reports
  logs: logs
