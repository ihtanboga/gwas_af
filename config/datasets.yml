# Outcome GWAS dataset registry.
#
# Schema for every entry:
#   trait: short trait label
#   trait_group: AF | HF | STROKE | SAFETY
#   source: provider key
#   dataset_label: human-readable label used in plots/reports
#   ancestry: EUR | MIXED | EAS | AFR | AMR
#   genome_build: GRCh37 | GRCh38
#   n_cases / n_controls (optional)
#   sample_overlap_notes: free text — flag UKB / FinnGen / 23andMe overlap
#   download_url_env: env present holding the download URL (NEVER inline credentials)
#   local_path: relative to data/raw/outcomes
#   license: e.g. CC0, CC-BY, custom
#   primary_or_replication: primary | replication | sensitivity
#
# All paths are placeholders until Phase 0 download/harmonization is run.

outcomes:

  # ---------------- Atrial fibrillation ----------------
  AF_primary:
    trait: atrial_fibrillation
    trait_group: AF
    source: CVDKP
    dataset_label: AF_2025_common_variants_Roselli
    ancestry: MIXED
    genome_build: GRCh38
    n_cases: null
    n_controls: null
    sample_overlap_notes: "Roselli 2025 includes UKB; treat as UKB-overlapping until cohort is verified."
    sample_overlap_flag: possible_UKB_overlap
    download_url_env: AFSHF_URL_AF_2025
    local_path: data/raw/outcomes/af/af_2025_common.tsv.gz
    license: CVDKP-terms
    primary_or_replication: primary

  AF_eur_2018_fallback:
    trait: atrial_fibrillation
    trait_group: AF
    source: CVDKP
    dataset_label: AF_HRC_2018_EUR
    ancestry: EUR
    genome_build: GRCh37
    n_cases: 55114
    n_controls: 482295
    sample_overlap_notes: "Roselli 2018 supplementary materials confirm UK Biobank inclusion. NOT UKB-free; sensitivity / older-AF concordance only (D020)."
    sample_overlap_flag: possible_UKB_overlap
    download_url_env: AFSHF_URL_AF_2018_EUR
    local_path: data/raw/outcomes/af/af_2018_eur.tsv.gz
    license: CVDKP-terms
    primary_or_replication: sensitivity

  AF_finngen_replication:
    trait: atrial_fibrillation
    trait_group: AF
    source: FinnGen
    dataset_label: FinnGen_R12_I9_AF
    ancestry: EUR
    genome_build: GRCh38
    n_cases: null
    n_controls: null
    sample_overlap_notes: "FinnGen R12 — UKB-free cohort (verified)."
    sample_overlap_flag: verified_UKB_free
    download_url_env: AFSHF_URL_FINNGEN_AF
    local_path: data/raw/outcomes/af/finngen_r12_af.tsv.gz
    license: FinnGen-terms
    primary_or_replication: replication

  # ---------------- Heart failure ----------------
