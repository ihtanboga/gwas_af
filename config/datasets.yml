    n_cases: 153174
    n_controls: 1815632
    sample_overlap_notes: "HERMES 2024 includes UKB. Independent support layer required for any UKB-PPP-derived target."
    sample_overlap_flag: verified_includes_UKB
    download_url_env: AFSHF_URL_HERMES_HF_OVERALL
    local_path: data/raw/outcomes/hf/hermes_2024_overall.tsv.gz
