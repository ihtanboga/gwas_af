  # ---------------- Stroke ----------------
  # D029 — primary stroke source = GIGASTROKE 2022 EUR (Mishra et al., Nat Genet 2022,
  # PMID 36180795). Harmonised summary statistics from GWAS Catalog (build GRCh38).
  Stroke_ischemic_gigastroke_eur:
    trait: ischemic_stroke
    trait_group: STROKE
    source: GIGASTROKE_GWAS_Catalog
    dataset_label: GIGASTROKE_2022_AIS_EUR
    ancestry: EUR
    genome_build: GRCh38
    n_cases: 62100
    n_controls: 1234808
    sample_overlap_notes: "GIGASTROKE 2022 EUR meta-analysis includes UKB+FinnGen+MVP among many cohorts; sample overlap risk with UKB-PPP discovery is non-trivial."
    sample_overlap_flag: possible_UKB_overlap
    download_url_env: AFSHF_URL_GIGASTROKE_AIS_EUR
    local_path: data/raw/outcomes/stroke_eur/gigastroke/GCST90104540.h.tsv.gz
    license: GWAS-Catalog terms; ISGC + Mishra 2022 citation; non-commercial scientific use
    primary_or_replication: primary

  Stroke_cardioembolic_gigastroke_eur:
